name: Fluency Quality Director

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'fluency-clean/src/**'
      - 'fluency-clean/e2e/quality-director/**'
      - 'fluency-clean/playwright.config.js'
      - 'fluency-clean/package.json'
      - 'fluency-clean/package-lock.json'

jobs:
  quality-director:
    name: Quality Director Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: fluency-clean

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fluency-clean/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run Quality Director
        run: npm run test:quality-director

      - name: Upload Quality Director artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-director-results
          path: |
            fluency-clean/audit-results/
            fluency-clean/playwright-report/
            fluency-clean/test-results/
          retention-days: 14
