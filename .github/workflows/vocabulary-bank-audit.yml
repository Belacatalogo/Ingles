name: Vocabulary Bank Audit

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: fluency-clean

jobs:
  audit:
    name: Run vocabulary bank audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fluency-clean/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vocabulary audit
        run: npm run vocabulary:audit

      - name: Show audit summary
        run: |
          echo "## Vocabulary Bank Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat docs/vocabulary/vocabulary-bank-audit-latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-bank-audit
          path: |
            fluency-clean/docs/vocabulary/vocabulary-bank-audit-latest.md
            fluency-clean/docs/vocabulary/vocabulary-bank-audit-latest.json
          if-no-files-found: error
