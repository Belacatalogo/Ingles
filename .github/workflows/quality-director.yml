name: Fluency Quality Director

on:
  workflow_dispatch:
    inputs:
      audit_mode:
        description: 'Modo da auditoria'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - smart
  push:
    branches:
      - main
    paths:
      - 'fluency-clean/src/**'
      - 'fluency-clean/e2e/quality-director/**'
      - 'fluency-clean/scripts/**'
      - 'fluency-clean/playwright.config.js'
      - 'fluency-clean/package.json'
      - 'fluency-clean/package-lock.json'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-director:
    name: Quality Director Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: fluency-clean

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fluency-clean/package.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Select Quality Director suites
        id: select_suites
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.audit_mode }}" = "full" ]; then
            node scripts/quality-director/select-suites.mjs --full
          else
            node scripts/quality-director/select-suites.mjs
          fi

      - name: Show selected suites
        run: |
          echo "Mode: ${{ steps.select_suites.outputs.mode }}"
          echo "Suites: ${{ steps.select_suites.outputs.suites }}"
          cat audit-results/quality-director-suite-selection.txt

      - name: Run Quality Director
        run: npx playwright test ${{ steps.select_suites.outputs.suites }}

      - name: Publish latest Quality Director report
        if: always()
        run: npm run quality-director:publish-latest

      - name: Commit latest Quality Director report
        if: always() && github.event_name != 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fluency-clean/docs/quality-director/latest/quality-director-latest.md fluency-clean/docs/quality-director/latest/quality-director-latest.json fluency-clean/docs/quality-director/latest/quality-director-latest-notion-summary.txt
          if git diff --cached --quiet; then
            echo "No Quality Director latest report changes to commit."
          else
            git commit -m "test: update quality director latest report [skip actions]"
            git push
          fi
        working-directory: .

      - name: Upload Quality Director artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-director-results
          path: |
            fluency-clean/audit-results/
            fluency-clean/playwright-report/
            fluency-clean/test-results/
            fluency-clean/docs/quality-director/latest/
          if-no-files-found: warn
          retention-days: 14
